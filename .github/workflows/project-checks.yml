name: Project Checks

on:
  pull_request:
    branches:
      - main
      - pre-staging
  push:
    branches:
      - main
      - pre-staging
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Root checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: ./.github/actions/cache-vite-npm
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      # The root manifest only carries what scripts/ imports, so this install is
      # one package - it also proves package.json and package-lock.json still
      # agree after the duplicate dependency block was removed.
      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Run root script tests
        run: npm run test:root

      - name: Run root checks
        working-directory: frontend
        run: npm run check
