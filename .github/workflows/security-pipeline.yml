name: Security & Dependency Review (Reusable)

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version to use"
        required: false
        default: "22"
        type: string
      is-pull-request:
        description: "Whether this is a pull request"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      # ------------------------------------------------------------
      # Checkout repository
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # ------------------------------------------------------------
      # Setup Node.js
      # ------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ------------------------------------------------------------
      # Enforce lockfile presence on PRs
      # ------------------------------------------------------------
      - name: Enforce package-lock.json presence
        if: ${{ inputs.is-pull-request }}
        run: |
          if [ ! -f package-lock.json ]; then
            echo "::error::package-lock.json is required for all PRs. Please run npm install and commit the lockfile."
            exit 1
          fi

      # ------------------------------------------------------------
      # Install dependencies (lockfile guaranteed to exist here)
      # ------------------------------------------------------------
      - name: Verify lockfile integrity (npm ci)
        run: npm ci

      # ------------------------------------------------------------
      # Lint lockfile
      # ------------------------------------------------------------
      - name: Lint lockfile
        run: |
          npx --yes lockfile-lint@5.1.0 \
            --path package-lock.json \
            --type npm \
            --validate-https \
            --allowed-hosts npm \
            --validate-integrity \
            --validate-package-names

      # ------------------------------------------------------------
      # Dependency Review (PRs only)
      # ------------------------------------------------------------
      - name: Scan for vulnerable dependencies
        if: ${{ inputs.is-pull-request }}
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
