name: Deploy Backend to Staging

concurrency:
  # Serializes backend deploys against each other. The staging frontend deploy
  # deliberately uses a DIFFERENT group ("deploy-staging"): the two publish
  # the same jobs-api target (see CURRENT_LINK below), so they do not need to
  # be serialized, and sharing one group would let GitHub cancel a pending
  # run of one workflow when the other is queued.
  group: deploy-staging-backend
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    branches:
      - pre-staging
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend-staging.yml"

env:
  # Must stay aligned with backend/composer.json's config.platform.php
  # override, and with .github/workflows/project-checks.yml's PHP_VERSION.
  PHP_VERSION: "8.5"

jobs:
  validate:
    name: Quality Gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          tools: composer

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: backend/vendor
          key: composer-${{ env.PHP_VERSION }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ env.PHP_VERSION }}-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHP formatting check (PHP-CS-Fixer)
        run: composer run format:check

      - name: PHP unit tests (PHPUnit)
        run: composer run test

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: staging
    permissions: {}

    outputs:
      release_timestamp: ${{ steps.timestamp.outputs.timestamp }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          tools: composer

      - name: Build production dependencies
        # Builds a clean, dev-free vendor/ directory right here in CI, on a
        # known PHP version, so the cPanel server never needs Composer or a
        # PHP version capable of running php-cs-fixer/phpunit's dependency
        # tree. The server only ever executes plain application PHP.
        working-directory: backend
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-progress

      - name: Generate Release Timestamp
        id: timestamp
        run: echo "timestamp=$(date +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Setup SSH
        env:
          KNOWN_HOSTS: ${{ secrets.KNOWN_HOSTS }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PRIVATE_KEY_B64: ${{ secrets.SSH_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh

          if [ -z "$KNOWN_HOSTS" ]; then
            echo "KNOWN_HOSTS is empty — set it in staging environment secrets."
            exit 1
          fi

          if [ -z "$SSH_PRIVATE_KEY" ] && [ -z "$SSH_PRIVATE_KEY_B64" ]; then
            echo "SSH_PRIVATE_KEY and SSH_PRIVATE_KEY_B64 are both empty."
            exit 1
          fi

          printf '%s\n' "$KNOWN_HOSTS" | sed 's/\r$//' > ~/.ssh/known_hosts

          if [ -n "$SSH_PRIVATE_KEY_B64" ]; then
            if ! printf '%s' "$SSH_PRIVATE_KEY_B64" | tr -d '\r\n ' | base64 -d > ~/.ssh/id_rsa; then
              echo "SSH_PRIVATE_KEY_B64 could not be base64-decoded."
              exit 1
            fi
          else
            KEY_CONTENT="$SSH_PRIVATE_KEY"
            if printf '%s' "$KEY_CONTENT" | grep -q '\\n'; then
              KEY_CONTENT="$(printf '%s' "$KEY_CONTENT" | sed 's/\\n/\n/g')"
            fi
            printf '%s\n' "$KEY_CONTENT" | sed 's/\r$//' > ~/.ssh/id_rsa
          fi

          chmod 600 ~/.ssh/id_rsa ~/.ssh/known_hosts

          if grep -qE '^(ssh-rsa|ssh-ed25519|ecdsa-sha2-)' ~/.ssh/id_rsa; then
            echo "The deploy key secret contains a public key, not a private key."
            exit 1
          fi

          if ! grep -qE '^-----BEGIN .+PRIVATE KEY-----$' ~/.ssh/id_rsa; then
            echo "The deploy key secret is not a valid private key file."
            exit 1
          fi

          if ! ssh-keygen -y -f ~/.ssh/id_rsa >/dev/null 2>&1; then
            echo "The deploy key secret could not be parsed by ssh-keygen."
            exit 1
          fi

      - name: Create Release Directory
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        env:
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          RELEASE_TIMESTAMP: ${{ steps.timestamp.outputs.timestamp }}
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key_path: /home/runner/.ssh/id_rsa
          port: ${{ secrets.REMOTE_PORT || 22 }}
          envs: REMOTE_USER,RELEASE_TIMESTAMP
          script: |
            set -euo pipefail
            mkdir -p "/home/$REMOTE_USER/backend-staging-releases/$RELEASE_TIMESTAMP"

      - name: Package and Sync Backend
        env:
          REMOTE_PORT: ${{ secrets.REMOTE_PORT || 22 }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          RELEASE_TIMESTAMP: ${{ steps.timestamp.outputs.timestamp }}
        run: |
          set -euo pipefail

          if [ ! -d "backend" ]; then
            echo "backend/ directory not found"
            exit 1
          fi

          if [ ! -f "backend/vendor/autoload.php" ]; then
            echo "backend/vendor/autoload.php not found — production build step did not produce a usable vendor/ directory."
            exit 1
          fi

          tar --exclude='./config.php' \
              --exclude='./config.local.php' \
              --exclude='./config.staging.php' \
              --exclude='./.git' \
              -czf backend-release.tar.gz -C backend .

          scp -P "${REMOTE_PORT:-22}" \
            -o StrictHostKeyChecking=yes \
            backend-release.tar.gz \
            "${REMOTE_USER}@${REMOTE_HOST}:/home/${REMOTE_USER}/backend-staging-releases/${RELEASE_TIMESTAMP}/"

      - name: Extract and Link Config
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        env:
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          RELEASE_TIMESTAMP: ${{ steps.timestamp.outputs.timestamp }}
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key_path: /home/runner/.ssh/id_rsa
          port: ${{ secrets.REMOTE_PORT || 22 }}
          envs: REMOTE_USER,RELEASE_TIMESTAMP
          script: |
            set -euo pipefail
            RELEASE_DIR="/home/$REMOTE_USER/backend-staging-releases/$RELEASE_TIMESTAMP"
            CONFIG_FILE="/home/$REMOTE_USER/config/backend-config-staging.php"
            tar -xzf "$RELEASE_DIR/backend-release.tar.gz" -C "$RELEASE_DIR"
            rm "$RELEASE_DIR/backend-release.tar.gz"

            # The shared staging config is a deployment prerequisite. Without
            # this check `ln -sf` would create a dangling config.php symlink
            # and the release would go live with a config that cannot load.
            if [ ! -f "$CONFIG_FILE" ]; then
              echo "CRITICAL ERROR: shared staging config $CONFIG_FILE is missing."
              echo "Aborting before linking config.php so no broken release is published."
              exit 1
            fi

            ln -sf "$CONFIG_FILE" "$RELEASE_DIR/config.php"

      # Atomically switch the jobs-api symlink inside staging.nairobidevops.org/
      #
      # WHY: The frontend owns staging.nairobidevops.org/ and deploys files directly
      # into it. The backend jobs-api must live as a symlink inside that folder.
      # The backend workflow creates/updates it here; the frontend workflow
      # recreates it after every frontend deploy (see staging-deploy.yml step 9).
      #
      # BACKEND_STAGING_REMOTE_PATH must be set to:
      #   /home/nairobid/staging.nairobidevops.org/jobs-api
      - name: Atomically Switch Symlink
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        env:
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          TARGET_LINK: ${{ secrets.BACKEND_STAGING_REMOTE_PATH }}
          RELEASE_TIMESTAMP: ${{ steps.timestamp.outputs.timestamp }}
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key_path: /home/runner/.ssh/id_rsa
          port: ${{ secrets.REMOTE_PORT || 22 }}
          envs: REMOTE_USER,TARGET_LINK,RELEASE_TIMESTAMP
          script: |
            set -euo pipefail

            RELEASE_DIR="/home/$REMOTE_USER/backend-staging-releases/$RELEASE_TIMESTAMP"
            RELEASES_DIR="/home/$REMOTE_USER/backend-staging-releases"
            TMP_LINK="${TARGET_LINK}.tmp"

            # CURRENT_LINK is the stable "live backend" pointer. The frontend
            # deploy (staging-deploy.yml) publishes the jobs-api symlink to
            # THIS path instead of guessing a release directory, so the two
            # workflows always agree on which backend release is live and can
            # run concurrently without racing each other's cleanup.
            CURRENT_LINK="$RELEASES_DIR/.current"

            # PREVIOUS_LINK remembers the release that was live before this
            # deploy, so a failed health check can restore it. It is refreshed
            # by the same step that publishes CURRENT_LINK, so it can never be
            # stale with respect to the current run.
            PREVIOUS_LINK="$RELEASES_DIR/.previous"

            # Ensure the parent staging directory exists
            # (it may not exist yet if frontend hasn't deployed yet)
            mkdir -p "$(dirname "$TARGET_LINK")"
            mkdir -p "$RELEASES_DIR"

            if [ -e "$TARGET_LINK" ] && [ ! -L "$TARGET_LINK" ]; then
              echo "CRITICAL ERROR: $TARGET_LINK is not a symlink — aborting."
              exit 1
            fi

            # Remember the currently live release for the rollback step.
            if [ -L "$CURRENT_LINK" ]; then
              ln -sfn "$(readlink "$CURRENT_LINK")" "${PREVIOUS_LINK}.tmp"
              mv -Tf "${PREVIOUS_LINK}.tmp" "$PREVIOUS_LINK"
              echo "🗂️  Previous release recorded: $(readlink "$PREVIOUS_LINK")"
            else
              rm -f "$PREVIOUS_LINK"
              echo "🗂️  No previous release (first deploy) — rollback will clear the pointer."
            fi

            # Publish the new release through the stable pointer.
            ln -sfn "$RELEASE_DIR" "${CURRENT_LINK}.tmp"
            mv -Tf "${CURRENT_LINK}.tmp" "$CURRENT_LINK"

            # Point the public jobs-api path at the stable pointer.
            ln -sfn "$CURRENT_LINK" "$TMP_LINK"
            mv -Tf "$TMP_LINK" "$TARGET_LINK"

            echo "✅ Symlink switched to release $RELEASE_TIMESTAMP."
            echo "   $CURRENT_LINK → $RELEASE_DIR"
            echo "   $TARGET_LINK → $CURRENT_LINK"

      - name: Health Check
        id: health_check
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
        run: |
          if [ -z "$STAGING_URL" ]; then
            echo "STAGING_URL is not set — skipping health check"
            exit 0
          fi

          MAX_RETRIES=5
          RETRY_COUNT=0
          SUCCESS=false

          while [ "$RETRY_COUNT" -lt "$MAX_RETRIES" ]; do
            HTTP_CODE=$(curl -L -s -o /dev/null \
              --connect-timeout 10 \
              --max-time 30 \
              -w '%{http_code}' \
              "$STAGING_URL" 2>/dev/null || echo "000")

            case "$HTTP_CODE" in
              2* | 3*)
                echo "✅ Health check passed (HTTP $HTTP_CODE)"
                SUCCESS=true
                break
                ;;
              *)
                RETRY_COUNT=$((RETRY_COUNT + 1))
                if [ "$RETRY_COUNT" -lt "$MAX_RETRIES" ]; then
                  sleep "$((2 ** RETRY_COUNT))"
                fi
                ;;
            esac
          done

          if [ "$SUCCESS" != true ]; then
            echo "Health check failed after $MAX_RETRIES attempts"
            exit 1
          fi

      # Roll back the live backend release when the health check fails.
      #
      # WHY: the release is published before the health check runs, so a failed
      # check would otherwise leave jobs-api serving the broken release. The
      # jobs-api symlink points at the stable CURRENT_LINK pointer, so rolling
      # back is a single pointer move — no symlink chain to rebuild.
      - name: Roll Back to Previous Release on Health Check Failure
        if: ${{ failure() && steps.health_check.outcome == 'failure' }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        env:
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          RELEASE_TIMESTAMP: ${{ steps.timestamp.outputs.timestamp }}
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key_path: /home/runner/.ssh/id_rsa
          port: ${{ secrets.REMOTE_PORT || 22 }}
          envs: REMOTE_USER,RELEASE_TIMESTAMP
          script: |
            set -euo pipefail

            RELEASES_DIR="/home/$REMOTE_USER/backend-staging-releases"
            RELEASE_DIR="$RELEASES_DIR/$RELEASE_TIMESTAMP"
            CURRENT_LINK="$RELEASES_DIR/.current"
            PREVIOUS_LINK="$RELEASES_DIR/.previous"

            # 1. Move the stable pointer back to the previously live release.
            #    PREVIOUS_LINK is written by the same step that published
            #    CURRENT_LINK, so it always describes this run's predecessor.
            if [ -L "$PREVIOUS_LINK" ]; then
              PREVIOUS_TARGET=$(readlink "$PREVIOUS_LINK")
              if [ -d "$PREVIOUS_TARGET" ]; then
                ln -sfn "$PREVIOUS_TARGET" "${CURRENT_LINK}.tmp"
                mv -Tf "${CURRENT_LINK}.tmp" "$CURRENT_LINK"
                echo "✅ Rolled back $CURRENT_LINK → $PREVIOUS_TARGET"
              else
                rm -f "$CURRENT_LINK"
                echo "⚠️  Previous release $PREVIOUS_TARGET no longer exists — cleared $CURRENT_LINK."
              fi
            else
              rm -f "$CURRENT_LINK"
              echo "⚠️  No previous release to restore — cleared $CURRENT_LINK."
            fi

            # 2. Delete the failed release so it can never be published again.
            rm -rf "$RELEASE_DIR"
            echo "🧹 Removed failed release $RELEASE_DIR"

      - name: Clean Old Releases
        if: success()
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        env:
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          RELEASE_TIMESTAMP: ${{ steps.timestamp.outputs.timestamp }}
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key_path: /home/runner/.ssh/id_rsa
          port: ${{ secrets.REMOTE_PORT || 22 }}
          envs: REMOTE_USER,RELEASE_TIMESTAMP
          script: |
            set -euo pipefail

            RELEASES_DIR="/home/$REMOTE_USER/backend-staging-releases"
            CURRENT="$RELEASE_TIMESTAMP"
            cd "$RELEASES_DIR"
            for dir in */; do
              dir="${dir%/}"
              if [ "$dir" != "$CURRENT" ]; then
                rm -rf "$dir"
              fi
            done

            # NOTE: the stable pointers (.current / .previous) are hidden files
            # and are therefore not matched by the */ glob above. .current
            # points at the release that was just published and must survive;
            # .previous may now dangle, which is expected — it is refreshed on
            # the next deploy.

            echo "✅ Staging backend deployment complete."

  notify:
    needs: [validate, deploy]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - name: Send Status Email
        continue-on-error: true
        uses: dawidd6/action-send-mail@94de994a9f6fffee200243214e17002e2920bb59 # v18
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: >-
            ${{ (needs.validate.result == 'success' && needs.deploy.result == 'success') && '✅' || '❌' }}
            Backend Staging Deploy
            ${{ (needs.validate.result == 'success' && needs.deploy.result == 'success') && 'Successful' || 'Failed' }}
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: ${{ secrets.MAIL_FROM }}
          body: |
            ${{ (needs.validate.result == 'success' && needs.deploy.result == 'success') && 'Backend deployed to staging successfully.' || 'Backend staging deployment FAILED.' }}
            Test at: ${{ secrets.STAGING_URL }}
            Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
