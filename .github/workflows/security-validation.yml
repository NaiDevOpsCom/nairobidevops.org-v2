name: Security Validation (Reusable)

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version"
        required: false
        default: "22"
        type: string
      check-only:
        description: "Run checks only (no fixes)"
        required: false
        default: false
        type: boolean
      fail-level:
        description: "Minimum vulnerability level to fail on"
        required: false
        default: "moderate"
        type: string

permissions:
  contents: read
  # Read-only: the reusable workflow runs only from hardened-build-check.yml,
  # whose caller grants pull-requests: read and cannot be elevated here.
  pull-requests: read

jobs:
  security-validation:
    name: Security and Dependency Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Need full history for dependency review on PRs

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          echo "📦 Installing dependencies..."
          npm ci --prefer-offline --no-audit --no-fund --ignore-scripts

      # Runs after the install: lockfile-lint is a devDependency and comes from
      # the lockfile being validated, so nothing is fetched on demand here.
      - name: Validate Lockfile Integrity
        run: |
          echo "🔒 Validating lockfile with lockfile-lint..."
          # Ensure lockfile exists
          if [ ! -f package-lock.json ]; then
            echo "::error::package-lock.json is required"
            exit 1
          fi
          # Use lockfile-lint for comprehensive validation
          ./node_modules/.bin/lockfile-lint \
            --path package-lock.json \
            --type npm \
            --validate-https \
            --allowed-hosts npm \
            --validate-integrity \
            --validate-package-names
          echo "✅ Lockfile validation passed"

      # npm audit exits non-zero in two very different situations:
      #   1. it FOUND vulnerabilities  -> a valid report, and the gate must fail
      #   2. the advisory endpoint was unreachable or rate-limited -> no report
      # The exit code cannot distinguish them, so a transient registry error used
      # to fail this required check with no diagnostic (every Dependabot PR at
      # once). This step retries only when no usable report was produced, and
      # evaluates the severity gate from that single report - no second query,
      # so the gate can never contradict itself. The threshold is unchanged.
      - name: Run NPM Audit
        id: npm-audit
        env:
          FAIL_LEVEL: ${{ inputs.fail-level }}
        run: |
          echo "🔍 Running npm audit..."

          # The verdict comes from scripts/audit-gate.mjs - the same module the
          # Quality Gates security leg runs - so the two required checks cannot
          # disagree about one lockfile. Exit 2 means the report was unusable
          # (registry or advisory endpoint unreachable): retry that, then fail
          # closed. The threshold itself is unchanged.
          attempt=1
          while [ "$attempt" -le 3 ]; do
            # `|| true` keeps the step alive so the report can still be uploaded;
            # success is judged below by the report body, not by this exit code.
            npm audit --json > audit-results.json 2> audit-stderr.txt || true

            rc=0
            node "$GITHUB_WORKSPACE/scripts/audit-gate.mjs" \
              --level "$FAIL_LEVEL" \
              --report audit-results.json || rc=$?

            case "$rc" in
              0|1) exit "$rc" ;;
            esac

            echo "::warning::npm audit returned no usable report (attempt ${attempt}/3)."
            sed -n '1,15p' audit-stderr.txt 2>/dev/null || true
            attempt=$((attempt + 1))
            if [ "$attempt" -le 3 ]; then
              sleep $(( (attempt - 1) * 15 ))
            fi
          done

          echo "::error::npm audit could not complete after 3 attempts - the npm registry or its advisory endpoint was unreachable. This is an infrastructure failure, not a dependency finding; re-run the job."
          exit 1

      # Runs even if the audit step failed, so dependency findings are still
      # reported instead of being masked by an unrelated failure above.
      - name: Dependency Review (PR only)
        if: ${{ !cancelled() && github.event.pull_request != null }}
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          base-ref: ${{ github.event.pull_request.base.sha }}
          head-ref: ${{ github.event.pull_request.head.sha }}
          # License policy is managed in .github/dependency-review-config.yml
          # to ensure compound SPDX expressions (e.g. "ISC AND JSON AND MIT")
          # are parsed as atomic allow-list entries (not split on comma).
          # The inline allow-licenses string format does not reliably handle
          # compound expressions — use the external YAML list format instead.
          config-file: .github/dependency-review-config.yml
          # Pass the caller's fail-level through explicitly so the action input
          # and the config file agree.
          fail-on-severity: ${{ inputs.fail-level }}
          # Summary comments stay disabled: the caller
          # (hardened-build-check.yml) grants only pull-requests: read.
          comment-summary-in-pr: never

      - name: Upload Audit Results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-audit-results
          path: frontend/audit-results.json
          retention-days: 30
          if-no-files-found: warn
