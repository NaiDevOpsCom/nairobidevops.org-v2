name: Quality Gates (Pre-Staging)

permissions:
  contents: read
  pull-requests: write

# Optimized concurrency - branch-based with global limit
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [pre-staging]
  pull_request:
    branches: [pre-staging]

# Global environment variables for all jobs
env:
  NODE_VERSION: "22"
  CACHE_VERSION: "v1"
  BUNDLE_SIZE_LIMIT_MB: "10"
  BUNDLE_SIZE_WARNING_MB: "8"

jobs:
  dependency-compat:
    name: Dependency Type Compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.actor == 'dependabot[bot]' || github.actor == 'renovate[bot]'
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: ./.github/actions/cache-vite-npm
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Dependencies
        run: npm ci --prefer-offline --no-audit --ignore-scripts

      - name: Check Type Compatibility
        run: |
          echo "🔷 Checking dependency type compatibility..."
          if npm run typecheck 2>&1; then
            echo "✅ Types compatible with updated dependencies"
            echo "compat-status=success" >> "$GITHUB_ENV"
          else
            echo "::error::Dependency update introduces type errors. The updated package may have breaking API changes."
            echo "::error::Fix the type errors in the source code, or manually review the dependency update."
            echo "compat-status=failed" >> "$GITHUB_ENV"
            exit 1
          fi

      - name: Quick Build Smoke Test
        run: |
          set -o pipefail
          echo "🏗️ Running quick build smoke test..."
          npm run security:generate
          ./node_modules/.bin/vite build --mode staging --logLevel error 2>&1 | tail -5
          echo "✅ Build smoke test passed"

  quality-checks:
    name: Comprehensive Quality Validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend

    strategy:
      matrix:
        check: [lint, types, tests, security, build, bundle, sitemap]
      # Don't cancel other jobs if one fails
      fail-fast: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1 # Shallow for faster checkout

      - name: Setup Node.js
        uses: ./.github/actions/cache-vite-npm
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Dependencies
        run: npm ci --prefer-offline --no-audit --ignore-scripts

      # FIXED: Separated lint checks - only run linting, not typecheck
      - name: Lint and Format Check
        if: matrix.check == 'lint'
        run: |
          echo "🔍 Running lint and format checks..."
          # Run ONLY linting and formatting, not typecheck (that's in the 'types' job)
          npm run check:lint
          npm run check:format

          # Output summary for reporting
          echo "lint-status=success" >> "$GITHUB_ENV"
          echo "lint-details=All linting checks passed" >> "$GITHUB_ENV"

      - name: TypeScript Validation
        if: matrix.check == 'types'
        run: |
          echo "🔷 Running TypeScript validation..."
          set -o pipefail

          # Capture the real exit status. Previously the failure was only
          # written to $GITHUB_ENV and never exited, so this leg reported green
          # even with type errors - a gate that could not fail.
          STATUS=0
          TYPECHECK_OUTPUT=$(npm run typecheck 2>&1) || STATUS=$?
          printf '%s\n' "$TYPECHECK_OUTPUT"

          if [ "$STATUS" -ne 0 ]; then
            ERROR_COUNT=$(printf '%s\n' "$TYPECHECK_OUTPUT" | grep -c "error TS" || true)
            echo "type-status=failed" >> "$GITHUB_ENV"
            echo "type-errors=${ERROR_COUNT}" >> "$GITHUB_ENV"
            echo "::error::TypeScript validation failed with ${ERROR_COUNT} error(s)."
            exit 1
          fi

          echo "type-status=success" >> "$GITHUB_ENV"
          echo "type-errors=0" >> "$GITHUB_ENV"
          echo "✅ No TypeScript errors"

      - name: Unit Tests
        if: matrix.check == 'tests'
        run: |
          echo "🧪 Running unit tests..."

          # Debug: Check if test files exist
          echo "🔍 Looking for test files..."
          TEST_FILES=$(find client -type f \( -name "*.test.ts" -o -name "*.test.tsx" -o -name "*.spec.ts" -o -name "*.spec.tsx" \) 2>/dev/null || true)

          # A test gate must not pass vacuously: if the suite disappears (bad
          # rename, deleted directory, wrong root) this has to fail loudly rather
          # than report a green check with nothing executed.
          if [ -z "$TEST_FILES" ]; then
            echo "::error::No test files found in client directory. Refusing to pass the test gate with nothing to run."
            echo "::error::Expected patterns: **/*.test.ts, **/*.spec.ts, **/__tests__/*.ts"
            echo "test-status=missing" >> "$GITHUB_ENV"
            exit 1
          fi

          echo "Found test files:"
          echo "$TEST_FILES"

          # Count test files
          TEST_COUNT=$(echo "$TEST_FILES" | wc -l)
          echo "📊 Total test files: $TEST_COUNT"

          # Run actual tests with coverage
          echo "⏳ Running test suite with coverage..."

          # Run tests - using the exact command that works locally.
          # Under the default `bash -e`, a failing suite aborted the step before
          # TEST_EXIT_CODE was captured; suspend -e so the reporting path runs.
          set +e
          npm test -- --coverage
          TEST_EXIT_CODE=$?
          set -e

          # Report test results
          if [ "$TEST_EXIT_CODE" -eq 0 ]; then
            echo "test-status=success" >> "$GITHUB_ENV"
            echo "✅ All tests passed"
          else
            echo "test-status=failed" >> "$GITHUB_ENV"
            echo "::error::Unit tests failed with exit code $TEST_EXIT_CODE"
            exit 1
          fi

      # Single security policy for both required checks: audit ALL dependencies
      # and fail at "moderate" or above, matching Hardened Build Verification
      # (.github/workflows/security-validation.yml, fail-level: moderate).
      # This leg previously gated production dependencies only and merely warned
      # on moderate risk, so the two required checks could disagree about the
      # same lockfile - a dev-only advisory failed one and passed the other.
      - name: Security Audit
        if: matrix.check == 'security'
        env:
          AUDIT_FAIL_LEVEL: moderate
        run: |
          echo "🛡️ Running security audit..."

          # Adjudicated by scripts/audit-gate.mjs, the same module Hardened Build
          # Verification uses, so both required checks apply one threshold to one
          # lockfile. Exit 2 means the report was unusable - retry, then fail
          # closed. A registry error must never read as "0 vulnerabilities", which
          # is exactly what the previous `jq ... // 0` counting did.
          attempt=1
          while [ "$attempt" -le 3 ]; do
            npm audit --json > audit-results.json 2> audit-stderr.txt || true

            rc=0
            node "$GITHUB_WORKSPACE/scripts/audit-gate.mjs" \
              --level "$AUDIT_FAIL_LEVEL" \
              --report audit-results.json \
              --github-env || rc=$?

            case "$rc" in
              0|1) exit "$rc" ;;
            esac

            echo "::warning::npm audit returned no usable report (attempt ${attempt}/3)."
            sed -n '1,15p' audit-stderr.txt 2>/dev/null || true
            attempt=$((attempt + 1))
            if [ "$attempt" -le 3 ]; then
              sleep $(( (attempt - 1) * 15 ))
            fi
          done

          echo "::error::npm audit could not complete after 3 attempts - the npm registry or its advisory endpoint was unreachable. This is an infrastructure failure, not a dependency finding; re-run the job."
          exit 1

      - name: Build and Security Generation
        if: matrix.check == 'build'
        run: |
          echo "🏗️ Running hardened build for staging..."

          # Generate security headers first
          npm run security:generate

          # Build with environment-specific flags (CI mode - skips duplicate checks)
          # Use build:ci:staging if you added it, otherwise just run vite directly
          if npm run | grep -q "build:ci:staging"; then
            npm run build:ci:staging
          else
            # Fallback for if script not found (shouldn't happen now but for resilience)
            npm run build:staging
          fi

          # Validate build artifacts
          if [ ! -d "dist" ]; then
            echo "::error::Build failed - no dist directory"
            exit 1
          fi

          echo "✅ Build directory created: dist/"

          # List generated files for verification
          echo "📁 Build artifacts:"
          ls -lh dist/ || true

          # Security hardening validation - no source maps in production builds
          if find dist -name "*.map" | grep -q .; then
            echo "::warning::Source maps found in build (may be okay for staging)"
            # Don't fail for staging, but log for awareness
          fi

          echo "build-status=success" >> "$GITHUB_ENV"

      - name: Bundle Size Analysis
        if: matrix.check == 'bundle'
        run: |
          echo "📦 Analyzing bundle size..."

          # Build for production without running checks (they already ran in other jobs)
          # Use CI build script if available, otherwise run vite directly
          if npm run | grep -q "build:ci"; then
            echo "Using CI build script..."
            npm run build:ci
          else
            echo "Running default prod build script..."
            npm run build:prod
          fi

          # Verify dist directory exists
          if [ ! -d "dist" ]; then
            echo "::error::Build failed - no dist directory created"
            exit 1
          fi

          # Get detailed size information
          DIST_SIZE_MB=$(du -sm dist | cut -f1)
          DIST_SIZE_BYTES=$(du -sb dist | cut -f1)

          # Analyze individual chunks
          echo "📊 Bundle Size Analysis:"
          CHUNK_SIZES=$(find dist -name "*.js" -exec du -sh {} + | sort -hr | head -n 10)

          echo "Total size: ${DIST_SIZE_MB}MB (${DIST_SIZE_BYTES} bytes)"
          echo ""
          echo "Top 10 largest chunks:"
          echo "$CHUNK_SIZES"

          # Evaluate against limits
          WARNING_BYTES=$(( BUNDLE_SIZE_WARNING_MB * 1024 * 1024 ))
          LIMIT_BYTES=$(( BUNDLE_SIZE_LIMIT_MB * 1024 * 1024 ))

          if [ "$DIST_SIZE_BYTES" -gt "$LIMIT_BYTES" ]; then
            echo "bundle-status=failed" >> "$GITHUB_ENV"
            echo "bundle-details=${DIST_SIZE_MB}MB exceeds ${BUNDLE_SIZE_LIMIT_MB}MB limit" >> "$GITHUB_ENV"
            echo "::error::Bundle size too large: ${DIST_SIZE_MB}MB > ${BUNDLE_SIZE_LIMIT_MB}MB"
            exit 1
          elif [ "$DIST_SIZE_BYTES" -gt "$WARNING_BYTES" ]; then
            echo "bundle-status=warning" >> "$GITHUB_ENV"
            echo "bundle-details=${DIST_SIZE_MB}MB approaching limit (${BUNDLE_SIZE_WARNING_MB}MB warning threshold)" >> "$GITHUB_ENV"
            echo "::warning::Bundle size ${DIST_SIZE_MB}MB is approaching the ${BUNDLE_SIZE_WARNING_MB}MB warning threshold"
          else
            echo "bundle-status=success" >> "$GITHUB_ENV"
            echo "bundle-details=${DIST_SIZE_MB}MB well within limits" >> "$GITHUB_ENV"
          fi

      - name: Sitemap Validation
        if: matrix.check == 'sitemap'
        run: |
          echo "🗺️ Validating sitemap and robots.txt..."

          # 0. Build project to populate dist/ without redundant checks
          npm run build:ci

          # 1. Generate sitemap
          npm run sitemap:generate

          # 2. Basic validation
          npm run sitemap:validate

          # 3. Strict validation tests
          npm run sitemap:test

          echo "sitemap-status=success" >> "$GITHUB_ENV"

      - name: Upload Check Results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: quality-results-${{ matrix.check }}
          path: |
            frontend/dist/
            frontend/coverage/
            frontend/reports/
          retention-days: 7

  quality-summary:
    name: Quality Gates Summary
    needs: [quality-checks]
    runs-on: ubuntu-latest
    if: always()

    steps:
      # This job previously printed a fixed report and could never fail, so it
      # advertised success while the matrix beside it was red. It now propagates
      # the upstream result, making it a truthful aggregate gate.
      - name: Verify upstream quality results
        run: |
          echo "# 📊 Quality Gates Summary"
          echo ""
          echo "Comprehensive Quality Validation: ${{ needs.quality-checks.result }}"
          echo ""

          if [ "${{ needs.quality-checks.result }}" != "success" ]; then
            echo "::error::Quality checks did not pass (result: ${{ needs.quality-checks.result }})."
            exit 1
          fi

          echo "✅ All quality checks passed"

  # NOTE: Deployment health check has moved to staging-deploy.yml.
  # The health-check step there curls STAGING_URL after the cPanel deploy
  # completes, giving a reliable post-deploy signal rather than checking
  # a Vercel preview URL that may not exist.

