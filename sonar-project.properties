# SonarQube Configuration
# Run: sonar-scanner (requires SonarQube server or sonarcloud.io)

sonar.projectKey=ndc-redesign-website
sonar.projectName=NDC Redesign Website
sonar.projectVersion=1.0.0

# Source directories (production code only — test paths are excluded below)
sonar.sources=frontend/client/src,frontend/shared

# Test directories (must be disjoint from sonar.sources)
sonar.tests=frontend/client/src/utils/__tests__

# Language-specific settings
sonar.javascript.file.suffixes=.ts,.tsx,.js,.jsx
sonar.typescript.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts

# Coverage
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Quality gate
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Exclusions (remove colocated test files from the source scope)
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.config.*,frontend/vite.config.ts,**/__tests__/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Encoding
sonar.sourceEncoding=UTF-8
