# SonarQube Configuration
#
# This repository is analysed by SonarCloud Automatic Analysis, which does not
# read this file. It exists for a manual/CI `sonar-scanner` run, and is kept in
# sync with the real project so that such a run targets the right project
# instead of silently failing.

sonar.projectKey=NaiDevOpsCom_nairobidevops.org-v2
sonar.organization=naidevopscom
sonar.projectName=nairobidevops.org-v2
sonar.projectVersion=1.0.0

# Analyse the whole repository. Scoping this down to the client source would
# hide findings in .github/ and scripts/ rather than fix them, and would make a
# manual scan disagree with Automatic Analysis.
sonar.sources=.

# Test directories (must be disjoint from sonar.sources)
sonar.tests=frontend/client/src/utils/__tests__

# Language-specific settings
sonar.javascript.file.suffixes=.ts,.tsx,.js,.jsx
sonar.typescript.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts

# Coverage
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Quality gate
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Exclusions: build output, dependencies, coverage data, and colocated tests
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.config.*,frontend/vite.config.ts,**/__tests__/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Encoding
sonar.sourceEncoding=UTF-8
