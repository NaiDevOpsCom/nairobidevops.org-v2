# SonarQube Configuration
# Run: sonar-scanner (requires SonarQube server or sonarcloud.io)

sonar.projectKey=ndc-redesign-website
sonar.projectName=NDC Redesign Website
sonar.projectVersion=1.0.0

# Source directories
sonar.sources=frontend/client/src,backend/src,backend/endpoints

# Test directories
sonar.tests=frontend/client/src,tests,backend/tests

# Language-specific settings
sonar.javascript.file.suffixes=.ts,.tsx,.js,.jsx
sonar.typescript.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts
sonar.php.exclusions=**/vendor/**,**/tests/**

# Coverage
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.php.coverage.reportPaths=backend/coverage/clover.xml

# Quality gate
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Exclusions
sonar.exclusions=**/node_modules/**,**/vendor/**,**/dist/**,**/coverage/**,**/*.config.*,frontend/vite.config.ts

# Encoding
sonar.sourceEncoding=UTF-8
